# ============================================================
# SERVICE A — Konfigurasi Aplikasi
# ============================================================
spring.application.name=service-a

# Port service ini
server.port=8081

# ============================================================
# POSTGRESQL — Konfigurasi Koneksi Database
#
# Kedua service konek ke database yang SAMA (webservice_db)
# tetapi mengakses tabel yang BERBEDA:
#   Service A → tabel: users
#   Service B → tabel: orders
#
# Sesuaikan username/password dengan PostgreSQL lokal kamu.
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/webservice_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
#
# ddl-auto=update: Hibernate otomatis membuat atau mengupdate
# struktur tabel berdasarkan @Entity class saat startup.
# Nilai lain: create, create-drop, validate, none
#
# show-sql=true: Tampilkan query SQL yang dijalankan ke console
# (berguna untuk debugging/belajar)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
