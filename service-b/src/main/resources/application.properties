# ============================================================
# SERVICE B — Konfigurasi Aplikasi
# ============================================================
spring.application.name=service-b

# Port service ini
server.port=8082

# ============================================================
# POSTGRESQL — Konfigurasi Koneksi Database
#
# Konek ke database yang SAMA dengan Service A (webservice_db)
# tetapi Service B hanya mengakses tabel: orders
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/webservice_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
