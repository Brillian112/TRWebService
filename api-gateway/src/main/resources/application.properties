# ============================================================
# API GATEWAY — Konfigurasi Aplikasi
# ============================================================
spring.application.name=api-gateway

# Port gateway ini — single entry point untuk semua client/BFF
server.port=8080

# ============================================================
# ROUTE 1 & ROUTE 2 didefinisikan secara programatik di:
#   com.example.api_gateway.config.GatewayConfig
# (path, method, target URI, dan filter per-route ada di sana)
# ============================================================

# Expose endpoint untuk melihat route yang aktif:
#   GET http://localhost:8080/actuator/gateway/routes
management.endpoints.web.exposure.include=gateway,health,info

# ============================================================
# RESILIENCE4J — Timeout untuk CircuitBreaker di Route 1 & Route 2
# Jika service-a / service-b tidak respon dalam 4 detik,
# dianggap gagal -> filter circuitBreaker akan panggil fallback.
# ============================================================
resilience4j.timelimiter.configs.default.timeout-duration=4s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s


jwt.secret=kel7-jwtfilter-anggota4-secret-xyzunique
jwt.expiration-ms=3600000

logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.api_gateway=INFO
