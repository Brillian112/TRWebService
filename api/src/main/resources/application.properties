# ================================================================
# API GATEWAY — Konfigurasi Utama
# Kelompok 7 | Topik 4: API Gateway & BFF
# Anggota 2: Route 1 — User Service (/api/users/**)
# ================================================================

spring.application.name=api-gateway

# ----------------------------------------------------------------
# SERVER PORT
# Gateway berjalan di port 8080, menjadi single entry point.
# Client hanya perlu tahu satu alamat: http://localhost:8080
# ----------------------------------------------------------------
server.port=8080

# ================================================================
# SPRING CLOUD GATEWAY — DEFINISI ROUTE
# ================================================================
#
# Setiap route terdiri dari 4 komponen:
#   1. id      : Nama unik untuk route (untuk logging & actuator)
#   2. uri     : Target/tujuan akhir request (backend service URL)
#   3. predicates : Kondisi/syarat agar route ini aktif
#   4. filters : Transformasi yang diterapkan ke request/response
#
# ================================================================

# ================================================================
# ROUTE 1 — USER SERVICE (Anggota 2)
# ================================================================
#
# DESKRIPSI:
#   Route ini menangkap semua request yang masuk ke gateway
#   dengan path /api/users/** dan meneruskannya ke service-a
#   yang berjalan di port 8081.
#
# PATH PATTERN: /api/users/**
#   Tanda /** berarti wildcard rekursif:
#     /api/users           → GET all users
#     /api/users/1         → GET/PUT/DELETE user by ID
#     /api/users/search    → endpoint pencarian (jika ada)
#
# METHOD: GET, POST, PUT, DELETE
#   Gateway menerima semua HTTP method untuk route ini.
#   Pembatasan method dilakukan oleh service-a itu sendiri.
#
# TARGET (URI): http://localhost:8081
#   Request akan diteruskan ke service-a yang listening di port 8081.
#   Path /api/users/** tetap dipertahankan (tidak di-strip).
#
# ================================================================

# Route ID — nama unik, muncul di log dan /actuator/gateway/routes
spring.cloud.gateway.routes[0].id=route-user-service

# Target URI — alamat backend service-a (User Service)
spring.cloud.gateway.routes[0].uri=http://localhost:8081

# ----------------------------------------------------------------
# PREDICATE (Kondisi Aktifnya Route)
# ----------------------------------------------------------------
# Path Predicate: Route aktif jika path URL cocok dengan pattern.
# Pattern /api/users/** mencakup semua sub-path di bawah /api/users/
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Method Predicate: Route aktif hanya untuk method HTTP berikut.
# Ini adalah lapisan seleksi pertama sebelum request diteruskan.
spring.cloud.gateway.routes[0].predicates[1]=Method=GET,POST,PUT,DELETE

# ----------------------------------------------------------------
# FILTERS (Penanganan / Transformasi Request & Response)
# ----------------------------------------------------------------

# FILTER 1 — AddRequestHeader
# Menambahkan header X-Gateway-Source ke setiap request yang
# diteruskan ke service-a. Header ini berguna untuk service-a
# agar bisa mengetahui bahwa request datang melalui gateway,
# bukan langsung ke service.
spring.cloud.gateway.routes[0].filters[0]=AddRequestHeader=X-Gateway-Source, api-gateway

# FILTER 2 — AddResponseHeader
# Menambahkan header X-Route-Name ke response yang dikembalikan
# ke client. Berguna untuk debugging (tau request lewat route mana).
spring.cloud.gateway.routes[0].filters[1]=AddResponseHeader=X-Route-Name, route-user-service

# FILTER 3 — Timestamp sudah ditangani oleh Route1LoggingFilter.java (PRE phase)
# SpEL T(System).currentTimeMillis() tidak didukung di SimpleEvaluationContext Gateway.

# ================================================================
# ROUTE 2 — ORDER SERVICE (Anggota 3)
# ================================================================
# [Dikerjakan oleh Anggota 3 — Order Service Route]
# Placeholder agar gateway bisa berjalan bersama nanti.
spring.cloud.gateway.routes[1].id=route-order-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].predicates[1]=Method=GET,POST,PUT,DELETE
spring.cloud.gateway.routes[1].filters[0]=AddRequestHeader=X-Gateway-Source, api-gateway
spring.cloud.gateway.routes[1].filters[1]=AddResponseHeader=X-Route-Name, route-order-service

# ================================================================
# ACTUATOR — Endpoint Monitoring Gateway
# ================================================================
# Mengaktifkan endpoint khusus gateway:
#   GET /actuator/gateway/routes       → lihat semua route
#   GET /actuator/gateway/routes/{id}  → detail satu route
#   GET /actuator/health               → status gateway
management.endpoints.web.exposure.include=health,routes,gateway
management.endpoint.gateway.enabled=true

# ================================================================
# LOGGING
# ================================================================
# Tampilkan log detail Spring Cloud Gateway untuk debugging.
# Level TRACE akan menampilkan setiap predicate dan filter yang dieksekusi.
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty.http.client=DEBUG
